name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run offline tests
        run: python -m pytest -ra
      - name: Build distributions
        run: python -m build
      - name: Smoke test wheel without optional dependencies
        run: |
          python -m venv "$RUNNER_TEMP/weightspace-wheel"
          . "$RUNNER_TEMP/weightspace-wheel/bin/activate"
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import importlib.util, weightspace.broker; assert importlib.util.find_spec('torch') is None"
          weightspace --help
          python -m weightspace --help
